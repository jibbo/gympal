<!DOCTYPE html>
<html lang="en">

<head>
	<title>Gym Pal</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="HandheldFriendly" content="true" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="GymPal">
	<link rel="icon" href="favicon.ico" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
	<link rel="apple-touch-icon-precomposed" href="ios_icon.png" />
	<link rel="manifest" href="manifest.json">
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="style.css" rel="stylesheet">
</head>

<body class="min-h-screen text-white scrollbar-hide bg-[var(--bg-color)]" style="touch-action: manipulation;">
	<header class="w-full text-center py-4 border-b border-white/10">
		<h1 class="text-3xl tracking-wider font-bold">Gym Pal</h1>
	</header>
	<main class="flex-1 flex flex-col">
		<span id="audio" class="hidden">
			<audio id="alarmSound">
				<source src="digital_watch_alarm_long.ogg" type="audio/ogg">
				Your browser does not support the audio element.
			</audio>
		</span>

		<!-- Row 1: Output + Timer -->
		<div class="flex flex-col lg:flex-row gap-4 p-2">
			<section id="output" class="flex-1 bg-[#1a1a1a] rounded-xl p-4 min-w-[280px]">
				<h4 class="text-lg text-white/60 mb-2 font-bold">SETS</h4>
				<div class="text-center">
					<p><span id="setsSpan" class="text-[96pt] font-bold leading-none text-center block"></span> completed</p>
				</div>
				<div class="flex gap-2 mt-4 justify-center text-center">
					<button onClick="resetSets()" class="py-3 px-6 rounded-lg font-bold text-xl">RESET</button>
					<button onClick="incSets()" class="py-3 px-6 rounded-lg font-bold text-xl">+1</button>
				</div>
			</section>

			<section id="timer" class="flex-1 bg-[#1a1a1a] rounded-xl p-4 min-w-[280px]">
				<h4 class="text-lg text-white/60 mb-2 font-bold">Active Timer</h4>
				<div class="text-center">
					<p><span id="timerSpan" class="text-[96pt] font-bold leading-none text-center block"></span></p>
				</div>
				<div class="flex items-center justify-center gap-2 mt-4 flex-col">
					<button onClick="clearTimer()" class="py-3 px-8 rounded-lg font-bold text-xl mx-auto">STOP</button>
					<button id="audioToggle" onClick="toggleAudio()" class="py-3 px-6 rounded-lg font-bold text-xl mx-auto">
						<svg id="speakerWave" class="hidden w-6 h-6 inline-block mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
						</svg>
						<svg id="speakerNone" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 inline-block mr-1">
							<path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
						</svg>
					</button>
				</div>
				<p id="iphoneNote" class="hidden text-center text-sm mt-2 font-sans"><i>To use audio on iPhone/iPad you must first click on the audio icon and then use the stop button to mute the sound immediately</i></p>
			</section>
		</div>

		<!-- Row 2: PinnedTimers + Weights + BarLoader -->
		<div class="flex flex-col lg:flex-row gap-4 p-2">
			<section id="pinnedTimers" class="flex-1 bg-[#1a1a1a] rounded-xl p-4 min-w-[280px]">
				<h4 class="text-lg text-white/60 mb-2 font-bold">Pinned Timers</h4>
				<div id="customTimers" class="flex gap-2 justify-center flex-wrap"></div>
				<div id="standardTimers" class="hidden">
					<button class="round col" onClick="startTimer(30)">30s</button>
					<button class="round col" onClick="startTimer(60)">1m</button>
					<button class="round col" onClick="startTimer(90)">1:30</button>
					<button class="round col" onClick="startTimer(120)">2m</button>
					<button class="round col" onClick="startTimer(180)">3m</button>
				</div>
			</section>

			<section id="weights" class="flex-1 bg-[#1a1a1a] rounded-xl p-4 min-w-[280px]">
				<h4 class="text-lg text-white/60 mb-2 font-bold">Weights counter (beta)</h4>
				<canvas id="canvas" class="w-full max-w-[300px] h-auto rounded-lg" width="300" height="150"></canvas>
				<div class="text-center mt-2 text-lg">
					<p><span id="totalWeight" class="font-bold"></span>Kg</p>
				</div>
				<div class="flex justify-center mt-4 mb-2">
					<button onClick="resetWeight()" class="py-3 px-8 rounded-lg font-bold text-xl mx-auto">RESET</button>
				</div>
				<div class="flex gap-2 justify-center flex-wrap">
					<button class="round col gray" onClick="addWeight(0.25)">0.25</button>
					<button class="round col gray" onClick="addWeight(0.5)">0.5</button>
					<button class="round col gray" onClick="addWeight(1.25)">1.25</button>
					<button class="round col gray" onClick="addWeight(2.5)">2.5</button>
					<button class="round col white" onClick="addWeight(5)">5</button>
					<button class="round col green" onClick="addWeight(10)">10</button>
					<button class="round col yellow" onClick="addWeight(15)">15</button>
					<button class="round col blue" onClick="addWeight(20)">20</button>
					<button class="round col red" onClick="addWeight(25)">25</button>
				</div>
			</section>

			<section id="BarLoader" class="flex-1 bg-[#1a1a1a] rounded-xl p-4 min-w-[280px]">
				<h4 class="text-lg text-white/60 mb-2 font-bold">Load weights into the bar</h4>
				<div class="flex gap-2 justify-center flex-wrap mb-4">
					<input id="weight" type="number" step="0.25" min="20" max="550" placeholder="how much you want to load?" class="py-2 px-3 rounded-lg flex-1 min-w-[140px]" />
					<input id="percentWeight" type="number" step="0.25" min="0" max="100" placeholder="% of weight (e.g. 70%)" class="py-2 px-3 rounded-lg flex-1 min-w-[140px]" />
				</div>
				<div class="flex justify-center">
					<button onClick="loadWeight()" class="py-3 px-8 rounded-lg font-bold text-xl mx-auto">Load</button>
				</div>
			</section>
		</div>
	</main>

	<footer class="w-full text-center border-t border-white/10 pt-4 pb-6">
		<div class="flex gap-3 justify-center">
			<button class="w-10 h-10 rounded-full cursor-pointer appearance-none border-2 border-transparent" style="background-color:#cfff04;border:none;" onclick="setGreenTheme()"></button>
			<button class="w-10 h-10 rounded-full cursor-pointer appearance-none border-2 border-transparent" style="background-color:#8800e7;border:none;" onclick="setPurpleTheme()"></button>
			<button class="w-10 h-10 rounded-full cursor-pointer appearance-none border-2 border-transparent" style="background-color:#ee7620;border:none;" onclick="setOrangeTheme()"></button>
		</div>
		<p class="mt-4 text-white/40 font-sans text-sm">Created with &lt;3 by Jibbo</p>
	</footer>
	<script src="app.js"></script>
</body>

</html>
